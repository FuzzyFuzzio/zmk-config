# CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Left as central - includes both trackpad and keyboard
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
# v0.3 queues trackpad events here too (default 5); headroom for bursts from the right half
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=32
# Keep the downstream pointer input queue at least as large as the split queue.
CONFIG_INPUT_QUEUE_MAX_MSGS=32

# This central draws its own layer; the right peripheral has no display.
CONFIG_ZMK_LAYER_SYNC=n

# Reduced idle/sleep timeouts when left is central
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
