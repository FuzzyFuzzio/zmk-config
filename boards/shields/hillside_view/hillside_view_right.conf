# CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_SPLIT=y

# The right half has a trackpad but no display.
CONFIG_ZMK_DISPLAY=n

# Local idle wake reinitializes the sensor, matching the hardware-tested build.
CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER=n
CONFIG_ZMK_TRACKPAD_IDLE_SLEEP=y

# A peripheral does not expose host USB HID; USB logging remains available separately.
CONFIG_ZMK_USB=n

# Accept the central's fresh just-works pairing over a stale bond (pairs with dongle autoheal).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
