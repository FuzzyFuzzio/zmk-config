on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ble_experiments:
        description: "Also build opt-in BLE A/B firmware (baseline builds always run)"
        type: boolean
        default: false

jobs:
  build:
    # Keep in lockstep with the zmk revision in config/west.yml.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  ble-experiments:
    # The reusable workflow merges/deletes artifact-* across the whole run.
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ble_experiments }}
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      build_matrix_path: build-experiments.yaml
      archive_name: firmware-ble-experiments
