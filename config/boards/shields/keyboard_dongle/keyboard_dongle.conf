# Central dongle configuration (board: nrf52840_mdk_usb_dongle//zmk, see config/boards/makerdiary)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
# Number of split BLE peripherals expected (left + right halves)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
# Trackpad events share this queue (default 5); headroom for bursts from the right half
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=32
# Disable sleep - dongle is always USB powered
CONFIG_ZMK_SLEEP=n

# Fix for "connected but no input" after peripheral reconnection:
# Accept GATT notifications even if subscription state is stale
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Allow overwriting oldest bond when bond table is full
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# Self-heal bond desync: if a peripheral re-pairs with new keys (e.g. after a
# settings reset on the half, or after a half-written NVS entry caused by a
# USB power glitch at PC startup), allow the new just-works pairing to
# overwrite the stale unauthenticated bond instead of refusing the link.
# Without this, a corrupted bond on either side leaves you stuck in
# "connected but no input" until you reflash everything.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# Match peripheral TX power for symmetric link quality
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Stay on 1M PHY (~3 dB better receiver sensitivity than 2M on nRF52840)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Pointer/trackpad support (receives the right half's trackpad via split input)
CONFIG_ZMK_POINTING=y
