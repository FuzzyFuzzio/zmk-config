# CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_SPLIT=y

# Match dongle/central TX power so the split uplink (which carries trackpad
# data) is symmetric. Without this the peripheral may transmit weaker than
# the central, degrading the high-rate pointer link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Accept the central's fresh just-works pairing over a stale bond (pairs with dongle autoheal).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
