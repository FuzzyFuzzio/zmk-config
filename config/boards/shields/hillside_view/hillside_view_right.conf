# CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_SPLIT=y

# Match dongle/central TX power so the split uplink (which carries trackpad
# data) is symmetric. Without this the peripheral may transmit weaker than
# the central, degrading the high-rate pointer link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Request the fastest BLE connection interval (6 * 1.25ms = 7.5ms) with zero
# slave latency. The right half hosts the physical trackpad, so a tight
# interval here directly improves pointer smoothness - especially in dongle
# mode where the central time-slices two connections.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
