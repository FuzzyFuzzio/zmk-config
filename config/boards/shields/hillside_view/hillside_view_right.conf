# CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_SPLIT=y

# Pinnacle sleep (~0.5s sample interval once untouched for ~5s) only while ZMK is idle,
# instead of always - removes the laggy first touch after a short pause.
# cirque-input-module only offers IDLE_SLEEPER under the deprecated ZMK_MOUSE symbol
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER=y

# Accept the central's fresh just-works pairing over a stale bond (pairs with dongle autoheal).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
