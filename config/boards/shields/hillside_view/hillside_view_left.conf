# CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_SPLIT=y

# Keep TX power matched with the central for a symmetric, reliable link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Split connection parameters are set by the central (CONFIG_ZMK_SPLIT_BLE_PREF_*);
# ZMK disables BT_GAP_AUTO_UPDATE_CONN_PARAMS on peripherals, so PREF_* here would be ignored.

# Accept the dongle's fresh just-works pairing over a stale bond (pairs with dongle autoheal).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
