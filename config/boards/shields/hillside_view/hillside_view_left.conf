# CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_SPLIT=y

# Keep TX power matched with the central for a symmetric, reliable link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# IMPORTANT: this .conf is used ONLY in dongle mode. In dongle mode the LEFT
# half is keys + display only - the physical trackpad lives on the RIGHT
# half (see hillside_view_right.overlay). The dongle central time-slices a
# single radio across TWO peripheral links, so if BOTH halves demand the
# fastest 7.5ms/zero-latency interval they over-subscribe the dongle. At
# power-on the second half to connect (typically the right) then fails to
# claim enough radio time and drops - exactly the "right side disconnects
# on boot" symptom.
#
# Because the left carries only low-rate key traffic, give it a relaxed
# interval with slave latency. This frees radio bandwidth for the right
# half's high-rate trackpad link (improving pointer responsiveness) while
# keeping key latency imperceptible - the peripheral still transmits on the
# next connection event whenever it actually has a keypress to send.
#
# The RIGHT half (hillside_view_right.conf) intentionally keeps the fast
# 7.5ms interval; it is shared with left-as-central mode, where a single
# connection makes the fast interval both stable and desirable.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
