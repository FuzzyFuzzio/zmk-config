CONFIG_ZMK_KEYBOARD_NAME="Fuzzio HSV"
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Uncomment these two line to add support for encoders to your firmware
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_DISPLAY=y

# BLE configs
# Max TX power on every half (and the dongle) keeps the split links symmetric;
# the right half's uplink carries trackpad data.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Stay on 1M PHY (~3 dB better receiver sensitivity than 2M on nRF52840)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before entering idle state (30 minutes)
CONFIG_ZMK_IDLE_TIMEOUT=1800000
# Milliseconds of inactivity before entering deep sleep (2 hours)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# Pointer/trackpad support
CONFIG_ZMK_POINTING=y
