manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: petejohanson
      url-base: https://github.com/petejohanson
  projects:
    # Latest stable ZMK release (Zephyr 3.5). main is on Zephyr 4.x and unreleased.
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: cirque-input-module
      remote: petejohanson
      # Keep BLE A/B builds on the same driver revision as the verified baseline.
      revision: 0de55f36bc720b5be3d8880dc856d4d78baf5214
  self:
    path: config
