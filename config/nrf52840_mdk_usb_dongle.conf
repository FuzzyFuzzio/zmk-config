# Applies to every build on the MDK dongle (keyboard_dongle and settings_reset).
# The stock Zephyr board falls back to SETTINGS_NONE, so the dongle forgot both halves on every power cycle.
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
